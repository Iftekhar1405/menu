<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 40" width="208" height="40"
     role="img" aria-label="menu.irad.solutions">
  <!--
    The lockup: mark plus wordmark, for anywhere outside the app itself —
    print, social cards, invoices. Inside the app the wordmark is live text in
    Bricolage Grotesque, which sets better and stays selectable.

    The weight split is the whole idea. "menu" is what the product is and
    carries full contrast; ".irad.solutions" is the address it lives at and
    steps back, so the name reads at a glance and the domain is still there
    when someone looks for it.
  -->
  <g transform="translate(0 4)">
    <rect width="32" height="32" rx="8" fill="#111113"/>
    <rect x="6.25" y="6.25" width="12.5" height="12.5" rx="3.75"
          fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="10.5" y="10.5" width="4" height="4" rx="1.25" fill="#FFFFFF"/>
    <rect x="20.5" y="20.5" width="6" height="6" rx="2" fill="#FFFFFF"/>
    <rect x="21" y="12" width="3.25" height="3.25" rx="1" fill="#FFFFFF" opacity="0.5"/>
    <rect x="12" y="21" width="3.25" height="3.25" rx="1" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <text x="44" y="26"
        font-family="'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="19" letter-spacing="-0.5">
    <tspan fill="#111113" font-weight="600">menu</tspan><tspan fill="#8B9099" font-weight="500">.irad.solutions</tspan>
  </text>
</svg>
