<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="menu.irad">
  <!--
    The mark is a QR finder pattern — the square-in-a-square people already
    know how to read, because it is literally the thing they point a camera at.
    Nothing else in the product is about scanning as directly as this.

    Deliberately achromatic. The whole design rests on the tenant's accent
    being the only colour in the interface, so our own mark stays out of the
    way in ink and white.
  -->
  <rect width="32" height="32" rx="8" fill="#111113"/>

  <!-- Finder: ring, gap, centre. -->
  <rect x="6.25" y="6.25" width="12.5" height="12.5" rx="3.75"
        fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <rect x="10.5" y="10.5" width="4" height="4" rx="1.25" fill="#FFFFFF"/>

  <!-- Three data modules, enough to read as a code without becoming noise. -->
  <rect x="20.5" y="20.5" width="6" height="6" rx="2" fill="#FFFFFF"/>
  <rect x="21" y="12" width="3.25" height="3.25" rx="1" fill="#FFFFFF" opacity="0.5"/>
  <rect x="12" y="21" width="3.25" height="3.25" rx="1" fill="#FFFFFF" opacity="0.5"/>
</svg>
