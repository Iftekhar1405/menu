services:
  db:
    image: postgres:16-alpine
    container_name: menu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu
      POSTGRES_DB: menu
    ports:
      # 5433 on the host so it never collides with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - menu-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d menu"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  menu-db-data:
